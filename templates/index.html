<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>n8n Automation</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <button id="new-project-btn" class="icon-btn" title="New Project">+</button>
      <h1>n8n Automation</h1>
    </div>
    <div class="top-right">
      <button id="menu-btn" class="icon-btn" title="Menu">&#9776;</button>
    </div>
  </header>

  <aside id="side-panel">
    <div class="side-panel-header">
      <h2>Projects</h2>
      <button id="close-side-panel-btn" class="icon-btn">&times;</button>
    </div>
    <div id="projects-container" class="projects-grid"></div>
    <div class="actions">
      <button id="sync-local">Sync Projects Locally</button>
    </div>
  </aside>

  <div id="overlay" class="hidden"></div>

  <main>
    <div class="main-grid">
      <section class="workspace">
        <h2>Workspace</h2>
        <iframe id="n8n-iframe" src="about:blank" frameborder="0"></iframe>
      </section>

      <section class="bottom-panel">
        <h3>.env & n8n Controls</h3>
        <div id="env-info"></div>
        <div class="n8n-controls">
          <button id="install-n8n">Install n8n</button>
          <button id="start-n8n">Start n8n</button>
          <button id="stop-n8n">Stop n8n</button>
        </div>
      </section>
    </div>
  </main>

  <!-- New project modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>Create New Project</h3>
      <label>
        Project Name
        <input id="new-name" type="text" placeholder="my-awesome-project" />
      </label>
      <div class="modal-actions">
        <button id="create-project">Create</button>
        <button id="cancel">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
